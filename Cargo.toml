[package]
name = "windows-lsa"
version = "0.1.0-dev"
edition = "2021"
license = "MIT"
authors = ["zevs"]
description = "Safe wrapper around Windows LSA Kerberos authentication package (LsaConnectUntrusted, KerbRetrieveTicket, KerbSubmitTicket, KerbQueryTicketCache, KerbPurgeTicketCache)"
repository = "https://github.com/icedracon/windows-lsa"
homepage = "https://github.com/icedracon/windows-lsa"
documentation = "https://docs.rs/windows-lsa"
readme = "README.md"
keywords = ["windows", "lsa", "kerberos", "ticket-cache", "authentication"]
categories = ["os::windows-apis", "authentication", "api-bindings"]

[dependencies]
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Security_Authentication_Identity",
    "Win32_System_Kernel",
    "Win32_Foundation",
] }
windows-core = "0.58"
