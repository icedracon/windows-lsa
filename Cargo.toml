[package]
name = "windows-lsa"
version = "0.1.0-dev"
edition = "2021"
license = "MIT"
authors = ["zevs"]
description = "Thin safe wrapper around Windows LSA Kerberos authentication package (LsaConnectUntrusted / KerbRetrieveEncodedTicket / KerbSubmitTicket / KerbQueryTicketCache). Pre-alpha."
repository = "https://github.com/icedracon/windows-lsa"
keywords = ["windows", "lsa", "kerberos", "security"]
categories = ["os::windows-apis", "authentication"]

[dependencies]
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Security_Authentication_Identity",
    "Win32_System_Kernel",
    "Win32_Foundation",
] }
windows-core = "0.58"
