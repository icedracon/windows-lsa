[package]
name = "windows-lsa"
version = "0.2.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["zevs"]
description = "Safe Rust access to Windows LSA Kerberos ticket-cache operations for authentication research and administration."
repository = "https://github.com/icedracon/windows-lsa"
homepage = "https://github.com/icedracon/windows-lsa"
documentation = "https://docs.rs/windows-lsa"
readme = "README.md"
keywords = ["windows", "lsa", "kerberos", "authentication", "security"]
categories = ["os::windows-apis", "authentication", "api-bindings"]

[dependencies]
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
win32-min = { version = "0.1.2", features = ["lsa-auth"] }
