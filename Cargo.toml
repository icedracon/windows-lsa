[package]
name = "windows-lsa"
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["zevs"]
description = "Safe wrapper around Windows LSA Kerberos authentication package (LsaConnectUntrusted, KerbRetrieveTicket, KerbSubmitTicket, KerbQueryTicketCache, KerbPurgeTicketCache). Built on win32-min (hand-rolled FFI, no windows-rs)."
repository = "https://github.com/icedracon/windows-lsa"
homepage = "https://github.com/icedracon/windows-lsa"
documentation = "https://docs.rs/windows-lsa"
readme = "README.md"
keywords = ["windows", "lsa", "kerberos", "ticket-cache", "authentication"]
categories = ["os::windows-apis", "authentication", "api-bindings"]

[dependencies]
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
win32-min = { version = "0.1", features = ["lsa-auth"] }
